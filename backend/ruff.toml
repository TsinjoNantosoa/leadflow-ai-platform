line-length = 130
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "B008", "S101", "UP046", "UP047", "S105", "S106", "S608"]

[lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
"alembic/*" = ["I", "E", "W", "UP"]
"app/services/seed.py" = ["B023"]
